[workspace]
members = [
    ".",
    "gcr-sys-minimal",
    "lib",
    "connection/debug",
    "connection/generic-group",
    "connection/libvirt",
    "connection/proxmox",
    "connection/proxmox/proxmox-api",
    "vte-pty-driver/lib",
    "vte-pty-driver/libvirt",
    "vte-pty-driver/proxmox",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
gettext-rs = { version = "0.8", features = ["gettext-system"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
futures = "0.3"
log = "0.4"
num_enum = "0.7"
indexmap = "2.14"
secure-string = "0.3"
http = "1.5"
uuid = { version = "1.26", features = ["v7"] }
parking_lot = "0.12"
field-monitor-vte-driver-lib = { path = "vte-pty-driver/lib" }
proxmox-api = { path = "connection/proxmox/proxmox-api" }
tokio = { version = "1.53", features = ["parking_lot", "rt-multi-thread"] }
zbus = "6.2"

[workspace.dependencies.glib]
features = ["log"]
version = "0.22"

[workspace.dependencies.gtk]
package = "gtk4"
features = ["v4_14"]
version = "0.11"

[workspace.dependencies.adw]
package = "libadwaita"
features = ["v1_8"]
version = "0.9"

[workspace.dependencies.rdw]
package = "rdw4"
git = "https://gitlab.gnome.org/theCapypara/rdw.git"
rev = "ed5ab7eec2073667f17006b311138b0ceee53bf1"

[workspace.dependencies.rdw-spice]
package = "rdw4-spice"
git = "https://gitlab.gnome.org/theCapypara/rdw.git"
rev = "ed5ab7eec2073667f17006b311138b0ceee53bf1"
default-features = false

[workspace.dependencies.rdw-vnc]
package = "rdw4-vnc"
git = "https://gitlab.gnome.org/theCapypara/rdw.git"
rev = "ed5ab7eec2073667f17006b311138b0ceee53bf1"
default-features = false

[workspace.dependencies.rdw-rdp]
package = "rdw4-rdp"
git = "https://gitlab.gnome.org/theCapypara/rdw.git"
rev = "ed5ab7eec2073667f17006b311138b0ceee53bf1"
default-features = false

[workspace.dependencies.rdw-qemu]
package = "rdw4-qemu"
git = "https://gitlab.gnome.org/theCapypara/rdw.git"
rev = "ed5ab7eec2073667f17006b311138b0ceee53bf1"
default-features = false

[workspace.dependencies.spice-gtk-usb-portal]
git = "https://github.com/theCapypara/spice-gtk-usb-portal.git"
rev = "6089d7a04ea3673c4086769f8c49db4b7fe0f511"

[workspace.dependencies.vte]
package = "vte4"
version = "0.10"
features = ["v0_76"]

[workspace.dependencies.oo7]
version = "0.6"
default-features = false
features = ["async-std", "native_crypto"]

[workspace.lints]
clippy.await_holding_refcell_ref = "deny"
clippy.todo = "warn"

[package]
name = "field-monitor"
description = "Viewer for virtual machines and other external screens"
edition = { workspace = true }
rust-version = { workspace = true }

[features]
devel = ["dep:field-monitor-debug"]
prod = ["log/release_max_level_info"]

[dependencies]
gettext-rs = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_ini = "0.2"
futures = { workspace = true }
uuid = { workspace = true }
fluent-uri = "0.4"
itertools = "0.15"
sorted-vec = "0.8"
secure-string = { workspace = true }
log = { workspace = true }
logforth = { version = "0.30", features = ["starter-log"] }
pem = "4"
num_enum = { workspace = true }
glib = { workspace = true }
gtk = { workspace = true }
adw = { workspace = true }
rdw = { workspace = true }
rdw-vnc = { workspace = true }
vte = { workspace = true }
oo7 = { workspace = true }
libfieldmonitor = { path = "./lib" }
gcr-sys-minimal = { path = "./gcr-sys-minimal" }
field-monitor-generic-group = { path = "./connection/generic-group" }
field-monitor-libvirt = { path = "./connection/libvirt" }
field-monitor-proxmox = { path = "./connection/proxmox" }
field-monitor-debug = { path = "./connection/debug", optional = true }

[lints]
workspace = true

[patch.crates-io]
epoxy = { git = "https://github.com/theCapypara/epoxy-rs", branch = "master" }
# ironrdp 0.17.0 on crates.io is stale (it still requires ironrdp-connector 0.10,
# which pins picky =7.0.0-rc.25). git master has the 0.18 development series.
# Commit cabd27f1a365a7ef9b197237551a5bcc36e50a04 is branch field-monitor on my fork, which includes
# #2495 and #2498 - TODO: Wait for merge and stable release.
ironrdp = { git = "https://github.com/theCapypara/IronRDP.git", rev = "cabd27f1a365a7ef9b197237551a5bcc36e50a04" }
ironrdp-tokio = { git = "https://github.com/theCapypara/IronRDP.git", rev = "cabd27f1a365a7ef9b197237551a5bcc36e50a04" }
ironrdp-tls = { git = "https://github.com/theCapypara/IronRDP.git", rev = "cabd27f1a365a7ef9b197237551a5bcc36e50a04" }
ironrdp-egfx = { git = "https://github.com/theCapypara/IronRDP.git", rev = "cabd27f1a365a7ef9b197237551a5bcc36e50a04" }
