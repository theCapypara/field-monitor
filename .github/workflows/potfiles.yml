on:
  push:
    branches: [ main ]
  pull_request:
name: POTFILES.in
jobs:
  pot-generation:
    name: POTFILE Generation
    runs-on: ubuntu-24.04
    container:
      image: fedora:rawhide
    steps:
      - uses: actions/checkout@v7

      - name: Generate POT file
        uses: ./.github/action/run-meson
        with:
          target: de.capypara.FieldMonitor-pot

  potfiles-completeness:
    name: POTFILES.in Completeness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check POTFILES.in
        run: build-aux/check-potfiles.sh
